[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "backend/api/migrations",
    "backend/.venv",
    "frontend",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"launcher.py" = ["S603"]
"backend/config/settings.py" = ["S105"]
"backend/config/tests.py" = ["S105", "S106"]
"backend/api/test*.py" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["launcher.py", "backend/config", "backend/api"]
mypy_path = "backend"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
exclude = [
    "backend/api/migrations/",
    "backend/api/test.*\\.py$",
]
